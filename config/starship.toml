
format = """
$directory$git_branch$git_status$git_state$python$cmd_duration$character
"""
add_newline = false
palette = "ghostty"

[palettes.ghostty]
bg          = "#0d1117"
fg          = "#c9d1d9"
black       = "#010409"
red         = "#f85149"
green       = "#3fb950"
yellow      = "#d29922"
blue        = "#58a6ff"
magenta     = "#bc8cff"
cyan        = "#39c5cf"
white       = "#c9d1d9"
bblack      = "#8b949e"
bred        = "#ff7b72"
bgreen      = "#56d364"
byellow     = "#e3b341"
bblue       = "#79c0ff"
bmagenta    = "#d2a8ff"
bcyan       = "#56d4dd"
bwhite      = "#f0f6fc"

[directory]
  style = "green"
  truncation_length = 3
  truncate_to_repo = true
  format = "[$path]($style) "

[character]
  success_symbol = "[>](bold green)"
  error_symbol = "[>](bold red)"
  vimcmd_symbol = "[>](bold blue)"

[git_branch]
  symbol = ""
  format = "[$symbol$branch]($style) "
  style = "cyan"

[git_status]
  format = "[$all_status$ahead_behind]($style) "
  style = "bblack"
  conflicted = "!"
  untracked = "?"
  modified = "!"
  staged = "+"
  renamed = "*"
  deleted = "-"
  stashed = ""
  ahead = ">"
  behind = "<"
  diverged = "<>"

[git_state]
  format = "\\([$state]($style)\\) "
  style = "magenta"

[cmd_duration]
  min_time = 500
  format = " [$duration]($style) "
  style = "bblack"

[python]
  symbol = ""
  format = " [$symbol$virtualenv]($style) "
  style = "bmagenta"

[username]
  style_user = "bwhite"
  style_root = "red"
  format = "[$user]($style)@"
  disabled = false
  show_always = true

[hostname]
  ssh_only = true
  format = "[$hostname]($style) "
  style = "magenta"
  disabled = false
