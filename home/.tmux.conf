set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 0
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on
set -g extended-keys 
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Open opencode in side panel 
bind o split-window -h -c "#{pane_current_path}" "opencode .; read"

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open a popup terminal
bind f display-popup -w 80% -h 80% -E $SHELL

# Navigate panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Status Bar (Ayu Dark palette) ---
set -g status-style bg=#0b0e14,fg=#bfbdb6
set -g status-left-length 100
set -g status-right-length 160

set -g status-position top
set -g status-justify centre
set -g status-interval 5

# Window status (Inactive)
setw -g window-status-style bg=#0d1017,fg=#565b66
setw -g window-status-format ' #[fg=#565b66]#I #[fg=#565b66]#W '

# Window status (Active)
setw -g window-status-current-style bg=#131721,fg=#bfbdb6,bold
setw -g window-status-current-format '#[fg=#0b0e14,bg=#e6b450,bold] #I #W '

# Status bar left (Session)
set -g status-left '#[fg=#0b0e14,bg=#e6b450,bold] 󱂬 #S '

# Status bar right (battery + host flush right, no trailing gap)
set -g status-right '#[fg=#bfbdb6,bg=#0d1017] #{battery_icon} #[fg=#0b0e14,bg=#e6b450,bold] #(whoami)@#H #[default]'

# Pane borders
set -g pane-border-style fg=#131721
set -g pane-active-border-style fg=#e6b450

# Message styling
set -g message-style fg=#bfbdb6,bg=#131721,bold
set -g message-command-style fg=#39bae6,bg=#0d1017

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Resurrect strategy for vim/neovim
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Capture pane contents
set -g @resurrect-capture-pane-contents 'on'
bind -n C-h if-shell "[[ ! \$(tmux display-message -p '#{pane_current_command}') =~ ^(?:vim|nvim)$ ]]" "select-pane -L" "send-keys C-h"
bind C-r run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh' \; display "Session restored!"

# Auto-install TPM if not present
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
