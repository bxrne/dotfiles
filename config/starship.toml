
format = """
$directory$git_branch$git_status$git_state$python$cmd_duration$character
"""
add_newline = false
palette = "ghostty"

[palettes.ghostty]
bg          = "#282c34"
fg          = "#ffffff"
black       = "#1d1f21"
red         = "#cc6566"
green       = "#b6bd68"
yellow      = "#f0c674"
blue        = "#82a2be"
magenta     = "#b294bb"
cyan        = "#8abeb7"
white       = "#c4c8c6"
bblack      = "#666666"
bred        = "#d54e53"
bgreen      = "#b9ca4b"
byellow     = "#e7c547"
bblue       = "#7aa6da"
bmagenta    = "#c397d8"
bcyan       = "#70c0b1"
bwhite      = "#eaeaea"

[directory]
  style = "green"
  truncation_length = 3
  truncate_to_repo = true
  format = "[$path]($style) "

[character]
  success_symbol = "[>](bold green)"
  error_symbol = "[>](bold red)"
  vimcmd_symbol = "[>](bold blue)"

[git_branch]
  symbol = ""
  format = "[$symbol$branch]($style) "
  style = "cyan"

[git_status]
  format = "[$all_status$ahead_behind]($style) "
  style = "bblack"
  conflicted = "!"
  untracked = "?"
  modified = "!"
  staged = "+"
  renamed = "*"
  deleted = "-"
  stashed = ""
  ahead = ">"
  behind = "<"
  diverged = "<>"

[git_state]
  format = "\\([$state]($style)\\) "
  style = "magenta"

[cmd_duration]
  min_time = 500
  format = " [$duration]($style) "
  style = "bblack"

[python]
  symbol = ""
  format = " [$symbol$virtualenv]($style) "
  style = "bmagenta"

[username]
  style_user = "bwhite"
  style_root = "red"
  format = "[$user]($style)@"
  disabled = false
  show_always = true

[hostname]
  ssh_only = true
  format = "[$hostname]($style) "
  style = "magenta"
  disabled = false
