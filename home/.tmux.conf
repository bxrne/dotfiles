
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on
set-window-option -g aggressive-resize on
set -g mode-style "fg=#161616,bg=#be95ff"

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open a popup terminal
bind f display-popup -w 80% -h 80% -E $SHELL

# Navigate panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Status Bar (Oxocarbon Palette) ---
# Background: #161616 | Foreground: #dde1e6
set -g status-style bg=#161616,fg=#dde1e6
set -g status-left-length 100
set -g status-right-length 160

set -g status-position top
set -g status-justify centre
set -g status-interval 5
set -g monitor-activity on
set -g visual-activity off
setw -g automatic-rename on
set -g set-titles on

# Window status (Inactive) - Gray/Blue
setw -g window-status-style bg=#262626,fg=#525252
setw -g window-status-format ' #[fg=#dde1e6]#I #[fg=#828c9a]#W '

# Window status (Active) - Oxocarbon Pink/Purple
setw -g window-status-current-style bg=#393939,fg=#ee79c1,bold
setw -g window-status-current-format '#[fg=#161616,bg=#be95ff,bold] #I #W '

# Status bar left (Session) - Purple
set -g status-left '#[fg=#161616,bg=#be95ff,bold]  #S '

# Status bar right - Teal/Cyan
set -g status-right '#[fg=#161616,bg=#33b1ff,bold] #(whoami)@#H #[default]'

# Pane borders
set -g pane-border-style fg=#262626
set -g pane-active-border-style fg=#be95ff

# Message styling
set -g message-style fg=#dde1e6,bg=#393939,bold
set -g message-command-style fg=#ee79c1,bg=#161616

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

bind -n C-h if-shell "[[ ! \$(tmux display-message -p '#{pane_current_command}') =~ ^(?:vim|nvim)$ ]]" "select-pane -L" "send-keys C-h"
bind C-r run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh' \; display "Session restored!"

# Auto-install TPM if not present
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'

