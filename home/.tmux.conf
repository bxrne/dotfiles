set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on
set -g set-clipboard on
set-window-option -g aggressive-resize on
set -g mode-style "fg=#222436,bg=#82aaff"
set -g exit-empty off

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open a popup terminal
bind f display-popup -w 80% -h 80% -E $SHELL

# Navigate panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Status Bar (Tokyo Night Moon, mirrors nvim palette) ---
# bg: #222436 | bg_dark: #1e2030 | bg_highlight: #2f334d | fg: #c8d3f5
# comment: #636da6 | dim: #828bb8 | green: #c3e88d | blue: #82aaff | cyan: #86e1fc
set -g status-style bg=#222436,fg=#c8d3f5
set -g status-left-length 100
set -g status-right-length 160

set -g status-position top
set -g status-justify centre
set -g status-interval 5
set -g monitor-activity on
set -g visual-activity on
setw -g automatic-rename on
set -g set-titles on

# Window status (Inactive) - comment on bg_highlight, mirrors inactive bufferline tabs
setw -g window-status-style bg=#2f334d,fg=#636da6
setw -g window-status-format ' #[fg=#c8d3f5]#I #[fg=#636da6]#W '

# Window status (Active) - blue, mirrors BufferLineSelected
setw -g window-status-current-style bg=#82aaff,fg=#222436,bold
setw -g window-status-current-format '#[fg=#222436,bg=#82aaff,bold] #I #W '

# Status bar left (Session) - normal-mode green, mirrors hardline normal
set -g status-left '#[fg=#222436,bg=#c3e88d,bold]  #S '

# Status bar right - blue, mirrors active buffer tab
set -g status-right '#[fg=#222436,bg=#82aaff,bold] #(whoami)@#H #[default]'

# Pane borders - mirror WinSeparator and the active accent
set -g pane-border-style fg=#2f334d
set -g pane-active-border-style fg=#82aaff

# Message styling
set -g message-style fg=#c8d3f5,bg=#2f334d,bold
set -g message-command-style fg=#86e1fc,bg=#222436

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

set -g @continuum-restore 'off'
set -g @continuum-save-interval '10'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'false'
set -g @resurrect-capture-pane-contents 'on'

# vim-tmux-navigator handles C-h/j/k/l navigation
bind C-r run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh' \; display "Session restored!"

# Auto-install TPM if not present
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'

