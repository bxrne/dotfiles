format = """
$username$hostname$directory$git_branch$git_status$git_state$python$cmd_duration$character
"""
add_newline = false

[directory]
  style = "bold #e6b450"
  truncation_length = 3
  truncate_to_repo = true
  format = "[$path]($style) "

[character]
  success_symbol = "[∷](bold #aad94c)"
  error_symbol = "[∷](bold #d95757)"
  vimcmd_symbol = "[∷](bold #e6b450)"

[git_branch]
  symbol = " "                        # branch symbol
  format = "[$symbol$branch]($style) "
  style = "bold #e6b450"

[git_status]
  format = "([$all_status$ahead_behind]($style)) "
  style = "#aad94c"
  conflicted = "="
  untracked = "?"
  modified = "!"
  staged = "+"
  renamed = "»"
  deleted = "✘"
  stashed = "≡"

[git_state]
  format = "[$state( $progress_current/$progress_total)]($style)"
  style = "bold #ffb454"

[cmd_duration]
  min_time = 500
  format = " [$duration]($style) "
  style = "#565b66"

[python]
  symbol = "  "                          # Python logo glyph
  format = "[$symbol$virtualenv]($style)"
  style = "#ffb454"

[username]
  style_user = "bold #bfbdb6"
  style_root = "bold #d95757"
  format = "[$user]($style)@"
  disabled = false
  show_always = true

[hostname]
  ssh_only = true
  format = "📡 [$hostname]($style) "
  style = "bold #e6b450"
  disabled = false
