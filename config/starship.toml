
format = """
$username$hostname$directory$git_branch$git_status$git_state$python$cmd_duration$character
"""
add_newline = false

[directory]
  style = "bold #b294bb"              # Ghostty Magenta
  truncation_length = 3
  truncate_to_repo = true
  format = "[$path]($style) "

[character]
  success_symbol = "[λ](bold #b6bd68)" # Ghostty Green
  error_symbol = "[λ](bold #cc6566)"   # Ghostty Red
  vimcmd_symbol = "[λ](bold #82a2be)"  # Ghostty Blue

[git_branch]
  symbol = " "
  format = "[$symbol$branch]($style) "
  style = "bold #8abeb7"               # Ghostty Cyan

[git_status]
  format = "([$all_status$ahead_behind]($style)) "
  style = "#b6bd68"
  conflicted = "="
  untracked = "?"
  modified = "!"
  staged = "+"
  renamed = "»"
  deleted = "x"
  stashed = "≡"

[git_state]
  format = "[$state( $progress_current/$progress_total)]($style)"
  style = "bold #f0c674"               # Ghostty Yellow

[cmd_duration]
  min_time = 500
  format = " [$duration]($style) "
  style = "#666666"                    # Ghostty Bright Black / Gray

[python]
  symbol = " "
  format = "[$symbol$virtualenv]($style)"
  style = "#c397d8"                    # Ghostty Bright Magenta

[username]
  style_user = "bold #eaeaea"          # Ghostty Bright White
  style_root = "bold #cc6566"
  format = "[$user]($style)@"
  disabled = false
  show_always = true

[hostname]
  ssh_only = true
  format = "[$hostname]($style) "
  style = "bold #b294bb"               # Ghostty Magenta
  disabled = false
