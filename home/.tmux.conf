unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on

# 1-based window/pane indexing
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Navigate panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# New windows/panes open in the same directory as the current pane
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Switch windows with n or their numeric index
bind n next-window
bind 0 select-window -t :10
bind 1 select-window -t :1
bind 2 select-window -t :2
bind 3 select-window -t :3
bind 4 select-window -t :4
bind 5 select-window -t :5
bind 6 select-window -t :6
bind 7 select-window -t :7
bind 8 select-window -t :8
bind 9 select-window -t :9

# --- Status bar ---
set -g status-position top
set -g status-justify right
set -g status-right ''
set -g status-left-length 40

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @tmux-fzf-launch-key 'F'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'

# Use tmux fzf over tmux session etc. commands
set -g @tmux-fzf-session 'on'
unbind s
bind s run-shell '~/.tmux/plugins/tmux-fzf/scripts/session.sh'
unbind w
bind w run-shell '~/.tmux/plugins/tmux-fzf/scripts/window.sh'
unbind p
bind p run-shell '~/.tmux/plugins/tmux-fzf/scripts/pane.sh'
unbind f
bind f run-shell '~/.tmux/plugins/tmux-fzf/scripts/find.sh'

# Persist sessions across restarts and auto-restore the last one
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Auto-install TPM if not present
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'
run-shell /Users/bxrne/Projects/swiss-tmux/swiss.tmux
