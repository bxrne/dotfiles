
format = """
$username$hostname$directory$git_branch$git_status$git_state$python$cmd_duration$character
"""
add_newline = false

[directory]
  style = "bold #ee5396"              # Oxocarbon Magenta
  truncation_length = 3
  truncate_to_repo = true
  format = "[$path]($style) "

[character]
  success_symbol = "[λ](bold #42be65)" # Oxocarbon Green
  error_symbol = "[λ](bold #fa4d56)"   # Oxocarbon Red
  vimcmd_symbol = "[λ](bold #82cfff)"  # Oxocarbon Blue

[git_branch]
  symbol = " "                        
  format = "[$symbol$branch]($style) "
  style = "bold #33b1ff"               # Oxocarbon Cyan

[git_status]
  format = "([$all_status$ahead_behind]($style)) "
  style = "#42be65"
  conflicted = "="
  untracked = "?"
  modified = "!"
  staged = "+"
  renamed = "»"
  deleted = "x"                       # Replaced emoji-like ✘ with x
  stashed = "≡"

[git_state]
  format = "[$state( $progress_current/$progress_total)]($style)"
  style = "bold #be95ff"               # Oxocarbon Purple

[cmd_duration]
  min_time = 500
  format = " [$duration]($style) "
  style = "#525252"                    # Oxocarbon Gray

[python]
  symbol = " "                         
  format = "[$symbol$virtualenv]($style)"
  style = "#be95ff"

[username]
  style_user = "bold #dde1e6"          # Oxocarbon White/Gray
  style_root = "bold #fa4d56"
  format = "[$user]($style)@"
  disabled = false
  show_always = true

[hostname]
  ssh_only = true
  format = "[$hostname]($style) "      # Removed satellite emoji
  style = "bold #ee5396"
  disabled = false

