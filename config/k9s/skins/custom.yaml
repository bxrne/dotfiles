k9s:
  # General K9s styles (Oxocarbon)
  body:
    fgColor: "#dde1e6"
    bgColor: default
    logoColor: "#be95ff"

  # ClusterInfoView (Top left info)
  info:
    fgColor: "#be95ff"
    sectionColor: "#393939"

  frame:
    border:
      fgColor: "#525252"
      focusColor: "#be95ff"

    menu:
      fgColor: "#dde1e6"
      keyColor: "#33b1ff"
      numKeyColor: "#be95ff"

    crumbs:
      fgColor: "#161616"
      bgColor: "#525252"
      activeColor: "#be95ff"

    status:
      newColor: "#dde1e6"
      modifyColor: "#33b1ff"
      addColor: "#42be65"
      errorColor: "#fa4d56"
      highlightcolor: "#be95ff"
      killColor: "#fa4d56"
      completedColor: "#525252"

    title:
      fgColor: "#be95ff"
      bgColor: default
      highlightColor: "#393939"
      counterColor: "#dde1e6"
      filterColor: "#ee5396"

  views:
    table:
      fgColor: "#dde1e6"
      bgColor: default
      cursorColor: "#393939"
      header:
        fgColor: "#be95ff"
        bgColor: default
        sorterColor: "#ee5396"

    yaml:
      keyColor: "#be95ff"
      colonColor: "#dde1e6"
      valueColor: "#525252"

    logs:
      fgColor: "#dde1e6"
      bgColor: default
      indicator:
        fgColor: "#33b1ff"
