gui:
  theme:
    activeBorderColor:
      - "#be95ff"
      - bold
    inactiveBorderColor:
      - "#525252"
    optionsTextColor:
      - "#33b1ff"
    selectedLineBgColor:
      - "#393939"
    cherryPickedCommitBgColor:
      - "#be95ff"
    cherryPickedCommitFgColor:
      - "#161616"
    unstagedChangesColor:
      - "#fa4d56"
    defaultFgColor:
      - "#dde1e6"
    searchingActiveBorderColor:
      - "#ee5396"
git:
  overrideGpg: true
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never --file-style=omit --hunk-header-style=omit --line-numbers
